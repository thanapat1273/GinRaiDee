services:
  db:
    build: ./db
    image: ginraidee-db:local
    container_name: ginraidee-db
    environment:
      POSTGRES_USER: ginraidee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ginraidee_local}
      POSTGRES_DB: ginraidee
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ginraidee -d ginraidee"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
